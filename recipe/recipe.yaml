context:
  version: "0.92.0"

package:
  name: claude-agent-acp
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@agentclientprotocol/claude-agent-acp/-/claude-agent-acp-${{ version }}.tgz
  sha256: 010e67d9f4871b3bf10f1d5472d4ee078a268fab12906e723d1d9c9e398e9b8c

build:
  noarch: generic
  number: 0

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - package_contents:
      bin:
        - claude-agent-acp

about:
  homepage: https://github.com/agentclientprotocol/claude-agent-acp
  summary: Bridges the Claude Agent SDK to the Agent Client Protocol (ACP)
  description: |
    claude-agent-acp is a TypeScript CLI tool by Zed Industries that bridges
    the Claude Agent SDK to the Agent Client Protocol (ACP), enabling Claude
    to be used as an ACP-compatible agent.
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  repository: https://github.com/agentclientprotocol/claude-agent-acp

extra:
  recipe-maintainers:
    - tdejager
    - dhirschfeld
